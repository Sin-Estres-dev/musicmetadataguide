<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Metadata Guide</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        .saved-data { margin-top: 20px; padding: 15px; background-color: #f8f9fa; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h2>Music Metadata Tracker</h2>
    <p>Organize your metadata to ensure proper royalty collection.</p>

    <form id="metadataForm">
        <label for="songTitle">Song Title:</label>
        <input type="text" id="songTitle" required placeholder="e.g., Midnight Vibes">

        <label for="isrc">ISRC (Recording Code):</label>
        <input type="text" id="isrc" placeholder="e.g., USX2X2112345">

        <label for="iswc">ISWC (Composition Code):</label>
        <input type="text" id="iswc" placeholder="e.g., T-123.456.789-Z">

        <label for="primaryArtist">Primary Artist:</label>
        <input type="text" id="primaryArtist" required placeholder="Artist Name">

        <button type="submit">Save Metadata</button>
    </form>

    <div class="saved-data" id="outputArea" style="display: none;">
        <h3>Saved Data (Stored Locally)</h3>
        <pre id="outputJSON"></pre>
    </div>

    <script>
        // STEP 3: Handle Local Storage
        const form = document.getElementById('metadataForm');
        const outputArea = document.getElementById('outputArea');
        const outputJSON = document.getElementById('outputJSON');

        // Load saved data when the app opens
        window.onload = () => {
            const savedData = localStorage.getItem('musicMetadata');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('songTitle').value = data.songTitle || '';
                document.getElementById('isrc').value = data.isrc || '';
                document.getElementById('iswc').value = data.iswc || '';
                document.getElementById('primaryArtist').value = data.primaryArtist || '';
                displayData(data);
            }
        };

        // Save data when the user submits the form
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Build the object based on our Schema
            const metadata = {
                songTitle: document.getElementById('songTitle').value,
                isrc: document.getElementById('isrc').value,
                iswc: document.getElementById('iswc').value,
                primaryArtist: document.getElementById('primaryArtist').value,
                lastUpdated: new Date().toISOString()
            };

            // Save to browser Local Storage
            localStorage.setItem('musicMetadata', JSON.stringify(metadata));
            displayData(metadata);
            alert("Metadata saved locally to your device!");
        });

        function displayData(data) {
            outputArea.style.display = 'block';
            outputJSON.textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>

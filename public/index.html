<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strezless Nexus</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 20px auto; padding: 15px; background: #f4f4f9; color: #333; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .profile-section { text-align: center; margin-bottom: 20px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        .profile-section img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #3498db; margin-bottom: 10px; display: none;}
        input, button { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; box-sizing: border-box;}
        button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #2980b9; }
        .track-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #e67e22; }
        .delete-btn { background: #e74c3c; padding: 8px; font-size: 14px; margin-top: 10px;}
    </style>
</head>
<body>
    <h1>🎵 Strezless Nexus</h1>

    <div class="profile-section">
        <h2>Artist Profile</h2>
        <img id="gravatar-img" src="" alt="Gravatar">
        <p id="gravatar-status">Enter your email to load your Gravatar</p>
        <input type="email" id="userEmail" placeholder="Enter your Gravatar Email">
        <button onclick="fetchGravatar()">Load Profile Picture</button>
    </div>

    <div style="background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
        <h2>Add New Track</h2>
        <form id="trackForm">
            <input type="text" id="trackTitle" placeholder="Track Title *" required>
            <input type="text" id="artistName" placeholder="Artist Name *" required>
            <input type="text" id="isrc" placeholder="ISRC">
            <input type="text" id="iswc" placeholder="ISWC">
            <button type="submit">Save Track Metadata</button>
        </form>
    </div>

    <h2>Your Catalog</h2>
    <div id="tracks-container">Loading tracks...</div>

    <script>
        // --- GRAVATAR LOGIC ---
        function fetchGravatar() {
            const email = document.getElementById('userEmail').value;
            if (!email) return alert("Please enter an email!");
            
            fetch(`/api/gravatar/${encodeURIComponent(email)}`)
                .then(res => res.json())
                .then(data => {
                    const img = document.getElementById('gravatar-img');
                    img.src = data.avatarUrl;
                    img.style.display = 'block';
                    document.getElementById('gravatar-status').innerText = "Profile loaded via MD5 Hash!";
                });
        }

        // --- TRACKS LOGIC ---
        function loadTracks() {
            fetch('/api/tracks').then(r => r.json()).then(tracks => {
                const container = document.getElementById('tracks-container');
                container.innerHTML = tracks.length === 0 ? '<p style="text-align:center;">No tracks yet.</p>' : '';
                tracks.reverse().forEach(track => {
                    const card = document.createElement('div');
                    card.className = 'track-card';
                    card.innerHTML = `
                        <h3>${track.trackTitle}</h3>
                        <p><strong>Artist:</strong> ${track.artistName}</p>
                        <p><strong>ISRC:</strong> ${track.isrc || 'N/A'} | <strong>ISWC:</strong> ${track.iswc || 'N/A'}</p>
                        <button class="delete-btn" onclick="deleteTrack('${track.id}')">Delete</button>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function deleteTrack(id) {
            if (confirm('Delete this track?')) {
                fetch(`/api/tracks/${id}`, { method: 'DELETE' }).then(loadTracks);
            }
        }

        document.getElementById('trackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTrack = {
                trackTitle: document.getElementById('trackTitle').value,
                artistName: document.getElementById('artistName').value,
                isrc: document.getElementById('isrc').value,
                iswc: document.getElementById('iswc').value
            };
            fetch('/api/tracks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newTrack) })
            .then(() => { document.getElementById('trackForm').reset(); loadTracks(); });
        });

        loadTracks();
    </script>
</body>
</html>
